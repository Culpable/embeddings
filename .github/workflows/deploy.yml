name: Validate migration source

# Workers Builds owns publishing. Preserve the existing gh-pages artefact until cutover acceptance.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npm test
